name: Build Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch: {}

jobs:
  build-apk:
    name: Build APK (Capacitor - debug + diagnostics)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Export runner temp as ANDROID_SDK_ROOT
        run: echo "ANDROID_SDK_ROOT=$RUNNER_TEMP/android-sdk" >> $GITHUB_ENV

      - name: Set up Node.js (Node 24)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm (official action)
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Check pnpm & node (diagnostics)
        run: |
          node -v
          npm -v
          pnpm -v || true
          echo "which pnpm: $(which pnpm || echo 'not found')"
          echo "PATH=$PATH"

      - name: Install Android command-line tools and SDK packages
        run: |
          set -e
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          cd "$ANDROID_SDK_ROOT"
          curl -sSL "https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip" -o cmdline.zip
          unzip -q cmdline.zip -d cmdline-tools
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools/bin:$PATH"
          yes | sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --licenses || true
          sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --install "platform-tools" "platforms;android-33" "build-tools;33.0.2" "cmdline-tools;latest"

      - name: Install dependencies (pnpm)
        run: pnpm install --frozen-lockfile

      - name: Build web (apps/web)
        run: pnpm --filter @wemd/web run build

      - name: Install Capacitor CLI & Android platform
        run: |
          pnpm add -w @capacitor/cli@latest @capacitor/android@latest

      - name: Initialize Capacitor (if missing) and add Android (use pnpm exec)
        run: |
          set -e
          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then
            pnpm exec cap init "WeMD" "com.iliefu.wemd" --web-dir=apps/web/dist
          fi
          if [ ! -d android ]; then
            pnpm exec cap add android
          fi
          pnpm exec cap copy android

      - name: Gradle diagnostics, ensure local.properties and wrapper, then build
        working-directory: android
        run: |
          set -e
          echo "=> Ensure local.properties points to SDK"
          if [ -z "${ANDROID_SDK_ROOT:-}" ]; then
            echo "ANDROID_SDK_ROOT is not set" >&2
            exit 1
          fi
          # write local.properties so Gradle can find Android SDK
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
          cat local.properties

          # Fix gradle wrapper to a stable 8.x if needed
          WRAPPER_FILE="gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$WRAPPER_FILE" ]; then
            echo "Setting Gradle wrapper distribution to gradle-8.13-all.zip"
            sed -i 's|^distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.13-all.zip|' "$WRAPPER_FILE" || true
          fi

          chmod +x ./gradlew || true

          echo "=== JAVA / GRADLE DIAGNOSTICS ==="
          echo "JAVA_HOME=$JAVA_HOME"
          java -version || true
          ./gradlew --version || true

          echo "=== Android SDK list (top-level) ==="
          ls -la "$ANDROID_SDK_ROOT" || true
          ls -la "$ANDROID_SDK_ROOT/platforms" || true

          echo "=== Try resolving dependencies (debug compile/runtime) ==="
          ./gradlew :app:dependencies --configuration debugCompileClasspath --no-daemon --stacktrace --info || true
          ./gradlew :app:dependencies --configuration debugRuntimeClasspath --no-daemon --stacktrace --info || true

          echo "=== Attempt to build debug with stacktrace/info ==="
          ./gradlew assembleDebug --no-daemon --stacktrace --info

      - id: find_apk
        name: Find debug APK
        run: |
          APK="$(find android -type f -name 'app-debug.apk' | head -n1 || true)"
          echo "apk_path=$APK" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wemd-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
