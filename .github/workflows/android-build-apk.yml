name: Build Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch: {}

jobs:
  build-apk:
    name: Build APK (Capacitor - debug)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      - name: Export runner temp as ANDROID_SDK_ROOT
        run: echo "ANDROID_SDK_ROOT=$RUNNER_TEMP/android-sdk" >> $GITHUB_ENV

      - name: Set up Node.js (use Node 18 for pnpm stability)
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'

      - name: Enable Corepack and ensure pnpm (with npm fallback)
        run: |
          set -e
          echo "Enabling corepack..."
          corepack enable || true
          echo "Preparing pnpm via corepack..."
          corepack prepare pnpm@9.0.2 --activate || true
          # If corepack didn't provide pnpm, install via npm as fallback
          if ! command -v pnpm >/dev/null 2>&1; then
            echo "corepack did not provide pnpm; installing globally via npm..."
            npm install -g pnpm@9
          fi

      - name: Check pnpm & node (diagnostics)
        run: |
          node -v
          npm -v
          pnpm -v || true
          echo "which pnpm: $(which pnpm || echo 'not found')"
          echo "PATH=$PATH"

      - name: Install Android command-line tools and SDK packages
        run: |
          set -e
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          cd "$ANDROID_SDK_ROOT"
          curl -sSL "https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip" -o cmdline.zip
          unzip -q cmdline.zip -d cmdline-tools
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools/bin:$PATH"
          yes | sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --licenses || true
          sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --install "platform-tools" "platforms;android-33" "build-tools;33.0.2" "cmdline-tools;latest"

      - name: Install dependencies (pnpm)
        run: pnpm install --frozen-lockfile

      - name: Build web (apps/web)
        run: pnpm --filter @wemd/web run build

      - name: Install Capacitor CLI
        run: pnpm add -w --workspace-root @capacitor/cli@latest

      - name: Initialize Capacitor (if missing) and add Android
        run: |
          set -e
          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then
            npx cap init "WeMD" "com.iliefu.wemd" --web-dir=apps/web/dist
          fi
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap copy android

      - name: Build Android debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - id: find_apk
        name: Find debug APK
        run: |
          APK="$(find android -type f -name 'app-debug.apk' | head -n1 || true)"
          echo "apk_path=$APK" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wemd-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
