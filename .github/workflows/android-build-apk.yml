name: Build Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch: {}

jobs:
  build-apk:
    name: Build APK (Capacitor - debug)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Export runner temp as ANDROID_SDK_ROOT
        run: echo "ANDROID_SDK_ROOT=$RUNNER_TEMP/android-sdk" >> $GITHUB_ENV

      - name: Set up Node.js 
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable Corepack and ensure pnpm (with npm fallback)
        run: |
          set -e
          echo "Enabling corepack..."
          corepack enable || true
          echo "Preparing pnpm via corepack..."
          corepack prepare pnpm@9.0.2 --activate || true
          if ! command -v pnpm >/dev/null 2>&1; then
            echo "corepack did not provide pnpm; installing globally via npm..."
            npm install -g pnpm@9
          fi

      - name: Check pnpm & node (diagnostics)
        run: |
          node -v
          npm -v
          pnpm -v || true
          echo "which pnpm: $(which pnpm || echo 'not found')"
          echo "PATH=$PATH"

      - name: Install Android command-line tools and SDK packages
        run: |
          set -e
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          cd "$ANDROID_SDK_ROOT"
          curl -sSL "https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip" -o cmdline.zip
          unzip -q cmdline.zip -d cmdline-tools
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools/bin:$PATH"
          yes | sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --licenses || true
          sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --install "platform-tools" "platforms;android-33" "build-tools;33.0.2" "cmdline-tools;latest"

      - name: Install dependencies (pnpm)
        run: pnpm install --frozen-lockfile

      - name: Build web (apps/web)
        run: pnpm --filter @wemd/web run build

      - name: Install Capacitor CLI & Android platform
        run: |
          # 在 workspace 根安装 Capacitor CLI 与 Android 平台包（使用 pnpm）
          pnpm add -w @capacitor/cli@latest @capacitor/android@latest

      - name: Initialize Capacitor (if missing) and add Android (use pnpm exec)
        run: |
          set -e
          # 如果没有配置文件则初始化（非破坏性）
          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then
            pnpm exec cap init "WeMD" "com.iliefu.wemd" --web-dir=apps/web/dist
          fi
          # 如果 android 平台目录不存在，则添加
          if [ ! -d android ]; then
            pnpm exec cap add android
          fi
          pnpm exec cap copy android

      - name: Gradle diagnostics and build (detailed)
        working-directory: android
        run: |
          set -e
          echo "=== ENV ==="
          echo "JAVA_HOME=$JAVA_HOME"
          java -version || true
          echo "Gradle wrapper properties:"
          cat gradle/wrapper/gradle-wrapper.properties || true
          echo "Gradle wrapper --version:"
          ./gradlew --version || true
          echo "List Android SDK:"
          ls -la "$ANDROID_SDK_ROOT" || true
          ls -la "$ANDROID_SDK_ROOT/platforms" || true
          echo "---- Attempt to run dependency resolution ----"
          ./gradlew app:dependencies --no-daemon --stacktrace --info || true
          echo "---- Attempt to build (debug) ----"
          ./gradlew assembleDebug --no-daemon --stacktrace --info

      - id: find_apk
        name: Find debug APK
        run: |
          APK="$(find android -type f -name 'app-debug.apk' | head -n1 || true)"
          echo "apk_path=$APK" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wemd-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
