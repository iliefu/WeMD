name: Build Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch: {}

jobs:
  build-apk:
    name: Build APK (Capacitor)
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install Android command-line tools and SDK packages
        run: |
          set -e
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          cd $ANDROID_SDK_ROOT
          curl -sSL "https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip" -o cmdline.zip
          unzip -q cmdline.zip -d cmdline-tools
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools/bin:$PATH"
          yes | sdkmanager --sdk_root=${ANDROID_SDK_ROOT} --licenses || true
          sdkmanager --sdk_root=${ANDROID_SDK_ROOT} --install "platform-tools" "platforms;android-33" "build-tools;33.0.2" "cmdline-tools;latest"

      - name: Install dependencies (pnpm)
        run: pnpm install --frozen-lockfile

      - name: Build web (apps/web)
        run: pnpm --filter @wemd/web run build

      - name: Install Capacitor CLI
        run: pnpm add -w --workspace-root @capacitor/cli@latest

      - name: Initialize Capacitor (if missing) and add Android
        run: |
          set -e
          # init only if capacitor config missing
          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then
            npx cap init "WeMD" "com.iliefu.wemd" --web-dir=apps/web/dist
          fi
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap copy android

      - name: Prepare keystore (from secrets)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app
          echo "$KEYSTORE_BASE64" | base64 --decode > android/keystore.jks

      - name: Build Android release
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - id: find_apk
        name: Find release APK
        run: |
          APK="$(find android -type f -name '*release*.apk' | head -n1 || true)"
          echo "apk_path=$APK" >> $GITHUB_OUTPUT

      - id: sign_and_zipalign
        name: Sign and zipalign (if keystore provided)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          APK_IN="${{ steps.find_apk.outputs.apk_path }}"
          if [ -z "$APK_IN" ]; then
            echo "No APK found to sign" && exit 1
          fi
          ZIPALIGN="$ANDROID_SDK_ROOT/build-tools/33.0.2/zipalign"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/33.0.2/apksigner"
          ALIGNED="${APK_IN%.apk}-aligned.apk"
          SIGNED="${APK_IN%.apk}-signed.apk"
          $ZIPALIGN -v -p 4 "$APK_IN" "$ALIGNED"
          $APKSIGNER sign --ks android/keystore.jks --ks-key-alias "$KEY_ALIAS" --ks-pass pass:"$KEYSTORE_PASSWORD" --key-pass pass:"$KEY_PASSWORD" --out "$SIGNED" "$ALIGNED"
          echo "signed_apk=$SIGNED" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wemd-apk
          path: |
            ${{ steps.find_apk.outputs.apk_path }}
            ${{ steps.sign_and_zipalign.outputs.signed_apk }}
